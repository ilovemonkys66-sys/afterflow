name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: ''
          - name: macOS
            os: macos-latest
            target: ''
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build desktop mod
        if: matrix.config.target == ''
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true

      - name: Build Android mod
        if: matrix.config.target == 'Android64'
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          combine: true

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
